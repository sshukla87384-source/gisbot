name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gis" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gis:gis@localhost:5432/gis
      REDIS_URL: redis://localhost:6379
      BOT_TOKEN: 0000000000:ci-dummy-token-not-real-0000000000000000
      ENCRYPTION_MASTER_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      JWT_SECRET: ci-dummy-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose — action-setup@v4 reads the repo-root
      # "packageManager" field, which is the single source of truth for the
      # pnpm version (the Dockerfiles' PNPM_VERSION ARG must match it).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm version is consistent across packageManager and the Dockerfiles
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "packageManager pins pnpm@$want"
          rc=0
          for f in infrastructure/docker/Dockerfile.node infrastructure/docker/Dockerfile.admin; do
            got="$(grep -oP '^ARG PNPM_VERSION=\K.*' "$f" || true)"
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::PNPM_VERSION=$got does not match packageManager pnpm@$want"
              rc=1
            fi
          done
          exit $rc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gis/database exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test
      # The admin panel is the only package with a build, and `next build`
      # typechecks every page the way a deploy does — CI green with a broken
      # build was how the panel failed on the VPS and nowhere else. It reads no
      # secrets at build time; NEXT_PUBLIC_API_URL is inlined, so a placeholder
      # is passed to keep the build deterministic (the real value comes from the
      # Dockerfile build arg).
      - name: Build (admin panel)
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm -r --if-present build
      - name: Verify migrations apply cleanly
        # `migrate deploy || db push` used to hide BOTH a broken migration and
        # the fact that there is no migration history at all. Decide explicitly.
        run: |
          if [ -d packages/database/prisma/migrations ]; then
            pnpm --filter @gis/database exec prisma migrate deploy
          else
            echo "::warning::packages/database/prisma/migrations/ is missing - there is no migration history to verify. Falling back to 'prisma db push'. Create one with 'prisma migrate dev --name init'."
            pnpm --filter @gis/database exec prisma db push
          fi

  docker:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.node
          build-args: APP=@gis/telegram-bot
          push: false
      # Dockerfile.admin is a different build entirely (Next standalone output,
      # its own pnpm filter, NEXT_PUBLIC_* inlining). Only ever built on the VPS
      # by deploy.sh, so a break in it was found during a deploy, not in CI.
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.admin
          build-args: NEXT_PUBLIC_API_URL=https://api.example.invalid
          push: false
      # To publish to GHCR: add permissions: packages: write, docker/login-action
      # with GITHUB_TOKEN, and set push: true + tags: ghcr.io/${{ github.repository }}/bot:latest
