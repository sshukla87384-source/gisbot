# Local development data stores only (the apps run on the host via `pnpm dev`).
# Ports are bound to 127.0.0.1 on purpose: a 0.0.0.0 bind publishes Postgres and
# Redis on every interface of the machine — including a public VPS IP — and both
# use trivial development credentials.
name: gis-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
